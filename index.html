<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
(function () {  /* تنبيه التثبيت: يظهر عند الفتح في Safari فقط وليس بعد التثبيت */
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios || navigator.standalone) return;
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;background:#13233F;color:#fff;border:1px solid #C9A23A;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.8;box-shadow:0 6px 20px rgba(0,0,0,.3)';
  d.innerHTML = '<b style="color:#C9A23A">ثبّت التطبيق على الآيفون</b><br>اضغط زر المشاركة (مربع وسهم للأعلى) في Safari ثم اختر «إضافة إلى الشاشة الرئيسية» — بعدها افتح التطبيق من أيقونته<button style="position:absolute;top:6px;left:10px;background:none;border:0;color:#fff;font-size:18px">✕</button>';
  d.querySelector('button').onclick = function () { d.remove(); };
  document.body.appendChild(d);
})();
</script>
